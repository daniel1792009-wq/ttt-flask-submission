<!doctype html>
<html lang="en">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width, initial-scale=1">
  <title>Tic Tac Toe</title>
  <link rel="stylesheet" href="{{ url_for('static', filename='style.css') }}">
  <script src="{{ url_for('static', filename='game.js') }}" defer></script>
</head>
<body>
<main id="game" data-api-url="{{ url_for('api_move') }}">
  <p class="eyebrow">FLASK TIC-TAC-TOE</p>
  <h1>Tic Tac Toe<span>.</span></h1>
  <p class="subtitle">Agent: X, Human: O</p>
  <div class="controls">
    <button id="new-game" type="button">New Game</button>
    <button id="who-starts" type="button">Who Starts: Agent</button>
    <label for="agent-type">Agent Type</label>
    <select id="agent-type">
      <option value="random">Random</option>
      <option value="qtable" disabled>Q-table — coming soon</option>
    </select>
  </div>
  <div class="board" role="group" aria-label="Tic-Tac-Toe board">
    {% for i in range(9) %}
    <button class="cell" type="button" data-index="{{ i }}" disabled
      aria-label="Row {{ i // 3 + 1 }}, column {{ i % 3 + 1 }}, empty"></button>
    {% endfor %}
  </div>
  <p id="status" role="status" aria-live="polite">Press New Game to start.</p>
  <noscript>Enable JavaScript to play.</noscript>
</main>
</body>
</html>
